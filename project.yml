name: Tables
options:
  bundleIdPrefix: com.passs0
  deploymentTarget:
    macOS: "13.0"
  fileTypes:
    icon:
      file: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Tables:
    type: application
    platform: macOS
    sources:
      - path: TablesHost
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.passs0.tables
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Tables"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        ASSETCATALOG_COMPILER_APPICON_NAME: Tables
        CODE_SIGN_ENTITLEMENTS: TablesHost/TablesHost.entitlements
    dependencies:
      - target: TablesExtension
        embed: true

  TablesExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: TablesExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.passs0.tables.extension
        INFOPLIST_FILE: TablesExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: TablesExtension/TablesExtension.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    dependencies:
      - sdk: MailKit.framework
